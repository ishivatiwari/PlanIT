name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: eventora_ci
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: eventora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventora_ci -d eventora_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: test
      AI_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://eventora_ci:ci-only-disposable-password@127.0.0.1:5432/eventora_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://eventora_ci:ci-only-disposable-password@127.0.0.1:5432/eventora_test
      TEST_DATABASE_URL: postgresql+psycopg://eventora_ci:ci-only-disposable-password@127.0.0.1:5432/eventora_test
      E2E_INTEGRATION: "true"
      E2E_AI_FIXTURE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked backend
        run: python -m pip install --require-hashes -r services/api/requirements-dev.lock
      - name: Backend checks
        working-directory: services/api
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
          python -m ruff check ../../scripts --config pyproject.toml
          python -m ruff format --check ../../scripts --config pyproject.toml
          python -m mypy app
          python ../../scripts/export_api_contract.py --check
          python -m pytest -q
          python -m alembic upgrade head
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Backend dependency scan
        run: python -m pip_audit -r services/api/requirements.lock --require-hashes
      - name: Source and browser-bundle secret check
        run: python scripts/check_secrets.py
      - name: Start API and test browser
        run: |
          cd services/api
          python -m uvicorn tests.e2e_app:create_test_app --factory --host 127.0.0.1 --port 8000 --no-access-log --no-proxy-headers > /tmp/eventora-api.log 2>&1 &
          cd ../../apps/web
          npm test
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Compose credentials
        run: python3 scripts/compose_env.py
      - name: Build, migrate, test recovery and persistence
        run: python3 scripts/verify_compose.py
      - name: Stop this CI stack
        if: always()
        run: docker compose --env-file .env.compose down

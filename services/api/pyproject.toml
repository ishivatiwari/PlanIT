[project]
name = "planit-api"
version = "0.1.0"
description = "PlanIT foundation API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn>=0.40,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]==3.3.6",
  "alembic>=1.17,<2",
  "tzdata==2026.5",
  "httpx2==2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx2>=2.13,<3",
  "ruff>=0.14,<1",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

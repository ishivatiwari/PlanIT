services:
  - type: web
    name: planit-web
    plan: free
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: planit-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: planit-api
    plan: free
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    dockerCommand: >
      sh -c "python -m alembic upgrade head &&
      python -m uvicorn app.main:create_app --factory
      --host 0.0.0.0 --port $PORT
      --no-access-log --no-proxy-headers"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        fromService:
          type: web
          name: planit-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: planit-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: planit-db
          property: connectionString
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta

databases:
  - name: planit-db
    databaseName: planit
    user: planit
    plan: free
    ipAllowList: []

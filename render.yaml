services:
  - type: web
    name: planit-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: API_INTERNAL_URL
        value: http://planit-api:8000

  - type: pserv
    name: planit-api
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        fromService:
          type: web
          name: planit-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: planit-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: planit-db
          property: connectionString
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta

databases:
  - name: planit-db
    databaseName: planit
    user: planit
    plan: free
    ipAllowList: []
